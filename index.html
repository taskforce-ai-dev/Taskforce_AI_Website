<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!--
      Per-page SEO (title, description, keywords, canonical, Open Graph, Twitter)
      is managed by the <SEO> component (react-helmet) so every route gets its
      own unique tags. Do NOT hard-code title/description/og/twitter here — doing
      so produces a second, duplicate set at runtime. Only genuine site-wide
      defaults that the SEO component does not emit belong in this file.
    -->
    <meta name="author" content="TaskForce AI">
    <meta property="og:site_name" content="TaskForce AI" />

    <!--
      Site-wide Organization + LocalBusiness + WebSite structured data. This is a
      genuine site-wide default (identical on every route), so it lives here in
      the head rather than in the per-route <SEO> component. Per-page schema
      (Article, Service, CollectionPage, …) is still emitted per route by <SEO>.
      Do NOT also emit an Organization/WebSite graph from a page component or the
      same @id nodes get duplicated.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.taskforceai.tech/#organization",
          "name": "TaskForce AI",
          "legalName": "TaskForce AI (Private) Limited",
          "url": "https://www.taskforceai.tech/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.taskforceai.tech/logo-icon.png"
          },
          "image": "https://www.taskforceai.tech/og-image.png",
          "description": "Sri Lanka's leading AI automation company, building AI voice agents, AI call centre agents, and intelligent workflow automation for businesses across Sri Lanka and the Middle East.",
          "telephone": "+94776697566",
          "email": "chrys@taskforceai.tech",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Nugegoda Business Centre, Unit 37, 2nd Floor, 80 Nawala Road",
            "addressLocality": "Nugegoda",
            "postalCode": "10250",
            "addressRegion": "Western Province",
            "addressCountry": "LK"
          },
          "sameAs": [
            "https://web.facebook.com/ForcAi",
            "https://www.linkedin.com/company/taskforceai-tech/",
            "https://www.instagram.com/taskforce.ai.tech"
          ]
        },
        {
          "@type": "LocalBusiness",
          "@id": "https://www.taskforceai.tech/#localbusiness",
          "name": "TaskForce AI",
          "image": "https://www.taskforceai.tech/og-image.png",
          "url": "https://www.taskforceai.tech/",
          "telephone": "+94776697566",
          "priceRange": "$$",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Nugegoda Business Centre, Unit 37, 2nd Floor, 80 Nawala Road",
            "addressLocality": "Nugegoda",
            "postalCode": "10250",
            "addressRegion": "Western Province",
            "addressCountry": "LK"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": "6.8649",
            "longitude": "79.8997"
          },
          "openingHoursSpecification": {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "09:00",
            "closes": "18:00"
          },
          "parentOrganization": {
            "@id": "https://www.taskforceai.tech/#organization"
          },
          "areaServed": [
            { "@type": "Country", "name": "Sri Lanka" },
            { "@type": "Country", "name": "Oman" },
            { "@type": "Country", "name": "United Kingdom" },
            { "@type": "AdministrativeArea", "name": "Middle East" }
          ],
          "additionalProperty": [
            { "@type": "PropertyValue", "name": "Branch", "value": "Muscat, Oman" },
            { "@type": "PropertyValue", "name": "Branch", "value": "London, United Kingdom" }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.taskforceai.tech/#website",
          "url": "https://www.taskforceai.tech/",
          "name": "TaskForce AI",
          "publisher": {
            "@id": "https://www.taskforceai.tech/#organization"
          },
          "inLanguage": "en"
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- Inline Tailwind Configuration to ensure styles load correctly -->
    <script>
      window.tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              primary: {
                DEFAULT: '#0066FF',
                dark: '#0052CC',
                light: '#3387FF'
              },
              secondary: {
                DEFAULT: '#7C3AED',
                dark: '#6328BE'
              },
              accent: {
                DEFAULT: '#06B6D4',
              },
              dark: {
                bg: '#0A0A0A',
                surface: '#1A1A1A',
                border: '#2A2A2A'
              }
            },
            backgroundImage: {
              'brand-gradient': 'linear-gradient(135deg, #0066FF 0%, #06B6D4 100%)',
              'premium-gradient': 'linear-gradient(135deg, #0066FF 0%, #7C3AED 50%, #06B6D4 100%)',
              'glass': 'linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%)'
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 6s ease-in-out 3s infinite',
              'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
              'shimmer': 'shimmer 2s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              pulseGlow: {
                '0%, 100%': { boxShadow: '0 0 0 0 rgba(0, 102, 255, 0)' },
                '50%': { boxShadow: '0 0 20px 8px rgba(0, 102, 255, 0.3)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-1000px 0' },
                '100%': { backgroundPosition: '1000px 0' }
              }
            }
          }
        }
      }
    </script>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?deps=react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0?deps=react@18.2.0",
    "framer-motion": "https://esm.sh/framer-motion@10.16.4?deps=react@18.2.0,react-dom@18.2.0",
    "lucide-react": "https://esm.sh/lucide-react@0.294.0?deps=react@18.2.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.20.0?deps=react@18.2.0,react-dom@18.2.0",
    "react-router": "https://esm.sh/react-router@6.20.0?deps=react@18.2.0",
    "@remix-run/router": "https://esm.sh/@remix-run/router@1.13.0",
    "lottie-react": "https://esm.sh/lottie-react@2.4.0?deps=react@18.2.0",
    "react-helmet-async": "https://esm.sh/react-helmet-async@2.0.4?deps=react@18.2.0,react-dom@18.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>

    
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/index.tsx"></script>

    <script
      src="https://unpkg.com/@elevenlabs/convai-widget-embed"
      async
      type="text/javascript"
    ></script>
  </body>
</html>
